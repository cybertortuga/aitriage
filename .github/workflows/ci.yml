name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # Fail closed: only the repository owner's immutable GitHub account ID may
    # start runner work. This repository deliberately has one operator.
    if: github.actor_id == '184216056'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and audit Web UI
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Download dependencies
        run: go mod download

      - name: Build (CGO for tree-sitter)
        run: CGO_ENABLED=1 go build -v ./...

      - name: Validate installer
        run: |
          sh -n scripts/install.sh scripts/install_test.sh
          sh scripts/install_test.sh

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          install-mode: goinstall

      - name: Test
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
