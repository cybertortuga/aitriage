# ==============================================================================
# AITriage — GoReleaser Configuration
# ==============================================================================
# Builds cross-platform binaries, publishes to GitHub Releases,
# and generates checksums.
# Triggered by: git tag v* → .github/workflows/release.yml
# ==============================================================================

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: aitriage
    main: ./cmd/aitriage
    binary: aitriage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: "🔒 Security"
      regexp: '^.*?(feat|fix)\(security\).*$'
      order: 0
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))?!?:.*$'
      order: 1
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))?!?:.*$'
      order: 2
    - title: "📦 Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

# ── Release Notes ─────────────────────────────────────────────────────────────
release:
  github:
    owner: cybertortuga
    name: aitriage
  name_template: "AITriage v{{ .Version }}"
  header: |
    ## AITriage v{{ .Version }}

    AI-Powered Security Audit Engine with 187 built-in rules across 11 technology stacks.

    ### Install
    ```bash
    # macOS / Linux (official release + checksum verification + scanner setup)
    curl -fsSL https://github.com/cybertortuga/aitriage/releases/latest/download/install.sh | sh

    # Go
    go install github.com/cybertortuga/aitriage/cmd/aitriage@v{{ .Version }}

    # Binary download — see assets below
    ```
  footer: |
    **Full Changelog**: https://github.com/cybertortuga/aitriage/compare/{{ .PreviousTag }}...{{ .Tag }}
